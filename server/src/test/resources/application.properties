# JWT issuer / access-token lifetime
app.jwt.issuer=krino-test
app.jwt.access-token-expiration.ms=900000

# CORS origins for tests
app.cors.allowed-origins=http://localhost:5173

# Cookies: disable the Secure flag so tests don't assume HTTPS
app.cookies.secure=false

# Admin bootstrap account used by AdminInitializer
app.admin.email=admin@test.local
app.admin.password=Test-Admin-Password-123

# Avoid attempting to bind to external services in tests
spring.data.redis.port=0