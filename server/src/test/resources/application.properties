 # Test profile properties - use in-memory H2 to avoid needing local MySQL during unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate create and drop schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Keep Redis autoconfiguration enabled so a (lazy) RedisConnectionFactory bean
# exists for RedisConfiguration#redisTemplate. The factory is created lazily and
# never opens a real connection during the context-load test.

