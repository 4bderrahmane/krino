 # Test profile properties - use in-memory H2 to avoid needing local MySQL during unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate create and drop schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Redis autoconfiguration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Simplified JWT config for tests
jwt.secret=V29uZGVyZnVsU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb25Jc05lZWRlZEhlcmU=

# Avoid attempting to bind to external services in tests
spring.data.redis.port=0