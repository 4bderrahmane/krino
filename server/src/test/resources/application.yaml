# Test profile properties - use in-memory H2 to avoid needing local MySQL ring unit tests.
spring:
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Let Hibernate create and drop the schema for tests.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  # Alternative test secrets:
  secret: "R0EyTHQgIJ8SJYeyEMYwB71zXSEVhLkOqnhauG8lARJ4U8EE80NAnTuVqcd0pjFRNxmy640jmK+PgMHekuhiUebO1U="

resend:
  api-key: "test-resend-api-key"

app:
  jwt:
    issuer: krino-test
    access-token-expiration: 15m

  cors:
    allowed-origins: "http://localhost:5000"

  frontend:
    url: "http://localhost:5000"

  # Dummy mail config so the Resend/mail beans wire up. Sends are @Async and never actually
  # reach Resend in tests, so the key is a placeholder.
  mail:
    from: "no-reply@krino.test"
    from-name: "Krino Test"

  ratelimit:
    enabled: false

  # Cookies: disable the Secure flag so tests don't assume HTTPS.
  cookies:
    secure: false

  admin:
    email: admin@test.local
    password: Test-Admin-Password-123

  storage:
    endpoint: "http://localhost:9000"
    access-key: minioadmin
    secret-key: minioadmin
    bucket: krino-test-cvs
    max-cv-size: 5MB
