# Test profile properties. The datasource URL/credentials and the MinIO endpoint/credentials
# are registered at runtime by AbstractIntegrationTest, which starts PostgreSQL and MinIO in
# Testcontainers — the suite runs against the same stack that ships.
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Mirrors application.yaml. This file shadows it wholesale rather than layering on top of
  # it, so anything the tests need to exercise has to be restated here.
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  # Schema management mirrors production: Flyway runs the real migrations and Hibernate
  # only validates the entity mapping against the migrated schema.
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

resend:
  api-key: "test-resend-api-key"

app:
  authentication:
    issuer: krino-test
    # Alternative test secret:
    secret: "R0EyTHQgIJ8SJYeyEMYwB71zXSEVhLkOqnhauG8lARJ4U8EE80NAnTuVqcd0pjFRNxmy640jmK+PgMHekuhiUebO1U="
    access-ttl: 15m
    refresh-ttl: 30d
    access-cookie-name: access_token
    refresh-cookie-name: refresh_token

  cors:
    allowed-origins: "http://localhost:5000"

  frontend:
    url: "http://localhost:5000"

  # Dummy mail config so the Resend/mail beans wire up. Sends are @Async and never actually
  # reach Resend in tests, so the key is a placeholder.
  mail:
    from: "no-reply@krino.test"
    from-name: "Krino Test"

  ratelimit:
    enabled: false

  # Cookies: disable the Secure flag so tests don't assume HTTPS.
  cookies:
    secure: false

  admin:
    email: admin@test.local
    password: Test-Admin-Password-123

  # Endpoint and credentials are overridden per run by AbstractIntegrationTest with the
  # Testcontainers MinIO coordinates; the bucket is created on demand by ResumeStorageService.
  storage:
    endpoint: "http://localhost:9000"
    access-key: minioadmin
    secret-key: minioadmin
    bucket: krino-test-cvs
    max-cv-size: 5MB
