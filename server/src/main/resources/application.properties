# Import local development values from server/.env when running from this directory.
# Docker Compose also provides the same names as process environment variables.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

jwt.secret=${JWT_SECRET}
app.refresh-token.hmac-secret=${APP_REFRESH_TOKEN_HMAC_SECRET:${JWT_SECRET}}
app.jwt.issuer=${APP_JWT_ISSUER:krino}
app.jwt.access-token-expiration.ms=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:5173,http://127.0.0.1:5000,http://127.0.0.1:5173}
app.cookies.secure=${APP_COOKIES_SECURE:true}

app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}
