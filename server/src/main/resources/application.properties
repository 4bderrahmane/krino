# Common configuration. Profile-specific defaults live in application-dev.properties
# and application-prod.properties.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
app.refresh-token.hmac-secret=${APP_REFRESH_TOKEN_HMAC_SECRET}
app.jwt.issuer=${APP_JWT_ISSUER}
app.jwt.access-token-expiration.ms=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cookies.secure=${APP_COOKIES_SECURE:true}

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
