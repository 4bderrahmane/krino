# Common configuration. Profile-specific defaults live in application-dev.yaml and application-prod.yaml.
spring:
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:}"
  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: "${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}"
    open-in-view: false
  servlet:
    multipart:
      max-file-size: "${APP_STORAGE_MAX_CV_SIZE:5MB}"
      # the added MB if for request headers and other metadata, and it's more than enough unless they're sending a dinosaur!
      max-request-size: "${APP_STORAGE_MAX_REQUEST_SIZE:6MB}"
#  mail:
#    host: "${MAIL_HOST}"
#    port: "${MAIL_PORT:587}"
#    username: "${MAIL_USERNAME:resend}"
#    password: "${MAIL_PASSWORD}"

jwt:
  secret: "${JWT_SECRET}"

# Actuator: expose only the health endpoint over HTTP, and never reveal component
# details/probes — the endpoint is public, so it must return at most {"status":"UP"}.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  refresh-token:
    hmac-secret: "${APP_REFRESH_TOKEN_HMAC_SECRET}"
  jwt:
    issuer: "${APP_JWT_ISSUER}"
    access-token-expiration: "${APP_JWT_ACCESS_TOKEN_EXPIRATION:15m}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS}"
  cookies:
    secure: "${APP_COOKIES_SECURE:true}"
  # Per-IP rate limiting for the public auth endpoints (login/register/refresh).
  # capacity = burst allowed; refill-period = time to refill a drained bucket.
  ratelimit:
    enabled: "${APP_RATE_LIMIT_ENABLED:true}"
    capacity: "${APP_RATE_LIMIT_AUTH_CAPACITY:10}"
    refill-tokens: 100
    refill-period: "${APP_RATE_LIMIT_AUTH_REFILL_PERIOD:1m}"
    idle-expiry: 10m
    max-keys: 100000
  admin:
    email: "${APP_ADMIN_EMAIL:}"
    password: "${APP_ADMIN_PASSWORD:}"
  storage:
    endpoint: "${APP_STORAGE_ENDPOINT:http://localhost:9000}"
    access-key: "${APP_STORAGE_ACCESS_KEY:minioadmin}"
    secret-key: "${APP_STORAGE_SECRET_KEY:minioadmin}"
    bucket: "${APP_STORAGE_BUCKET:krino-cvs}"
    max-cv-size: "${APP_STORAGE_MAX_CV_SIZE:5MB}"

  mail:
    from: "${APP_MAIL_FROM}"
    from-name: "${APP_MAIL_FROM_NAME}"
  # Public base URL of the frontend, used to build links in emails (login, password reset).
  # No trailing slash. Prod overrides this via APP_FRONTEND_URL.
  frontend:
    url: "${APP_FRONTEND_URL:http://localhost:5000}"
resend:
  api-key: "${RESEND_API_KEY}"