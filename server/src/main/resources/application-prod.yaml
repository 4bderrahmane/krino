spring:
  jpa:
    hibernate:
      ddl-auto: "${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}"

app:
  cookies:
    secure: "${APP_COOKIES_SECURE:true}"

server:
  forward-headers-strategy: framework

# API docs stay off in production unless explicitly enabled via SPRINGDOC_ENABLED=true.
springdoc:
  api-docs:
    enabled: "${SPRINGDOC_ENABLED:false}"
  swagger-ui:
    enabled: "${SPRINGDOC_ENABLED:false}"
