version: 2
updates:
  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
    # One PR for routine bumps; majors still arrive individually.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base-image and action bumps are low-risk; take each week's batch as one PR.
  - package-ecosystem: docker
    directories: [/server, /client]
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
