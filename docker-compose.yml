services:
  db:
    # Disabled by default while testing MinIO only.
    profiles: ["app"]
    image: postgres:18-alpine
    container_name: krino-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krino}
      POSTGRES_USER: ${POSTGRES_USER:-krino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: krino-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: krino-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-krino-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: krino-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-krino-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-krino-cvs}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        sleep 2;
      done;
      mc mb --ignore-existing local/\"$${APP_STORAGE_BUCKET}\";
      "
    restart: "no"

  server:
    # Disabled by default while testing MinIO only.
    profiles: ["app"]
    build:
      context: ./server
    container_name: krino-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Copy server/.env.example to server/.env for JWT/admin secrets.
    # Compose overrides DB and MinIO addresses so containers talk over the
    # internal compose network instead of localhost.
    env_file:
      - path: ./server/.env
        required: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-krino}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-krino}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-krino-minio}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-krino-cvs}
      APP_STORAGE_MAX_CV_SIZE: ${APP_STORAGE_MAX_CV_SIZE:-5MB}
      APP_STORAGE_MAX_REQUEST_SIZE: ${APP_STORAGE_MAX_REQUEST_SIZE:-6MB}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  client:
    # Disabled by default while testing MinIO only.
    profiles: ["app"]
    build:
      context: ./client
    container_name: krino-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
