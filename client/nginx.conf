server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API to the backend so the SPA and API share one origin.
    # This is what lets the backend rate limiter trust the client IP: nginx is the
    # only path in, so we overwrite X-Forwarded-For with the real peer ($remote_addr)
    # and the backend (server.forward-headers-strategy=framework) reads it via
    # request.getRemoteAddr(). A client-supplied X-Forwarded-For is discarded here, so
    # it cannot be spoofed to poison or bypass the per-IP limit.
    #
    # Requires: the backend ('server') must NOT be reachable except through nginx
    # (don't publish its port publicly), otherwise X-Forwarded-For can be forged by
    # connecting to it directly.
    location /api/ {
        proxy_pass http://server:8080;     # no trailing slash: keeps the /api prefix

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # authoritative; ignore client-sent XFF
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must be >= the backend's APP_STORAGE_MAX_REQUEST_SIZE (6MB) so a too-large
        # CV upload is rejected by the backend's friendly 413 rather than a bare nginx one.
        client_max_body_size 8m;
    }

    # Serve static files directly, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for longer
    location ~* \.(?:css|js|svg|ttf|woff|woff2|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Optional: security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
