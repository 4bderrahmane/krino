server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API to the backend so the SPA and API share one origin.
    # Nginx is the only public route to the backend. Replace the client IP
    # headers and discard other client-supplied forwarding headers before Spring
    # uses them for request.getRemoteAddr() and per-IP rate limiting.
    # If a trusted load balancer is added in front, configure nginx real_ip with
    # that balancer's exact addresses before relying on $remote_addr.
    location /api/ {
        proxy_pass http://server:8080;     # no trailing slash: keeps the /api prefix

        proxy_set_header Host               $host;
        proxy_set_header Forwarded          "";
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   "";
        proxy_set_header X-Forwarded-Port   "";
        proxy_set_header X-Forwarded-Ssl    "";
        proxy_set_header X-Forwarded-Prefix "";

        # Must be >= the backend's APP_STORAGE_MAX_REQUEST_SIZE (6MB) so a too-large
        # CV upload is rejected by the backend's friendly 413 rather than a bare nginx one.
        client_max_body_size 8m;
    }

    # Serve static files directly, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for longer
    location ~* \.(?:css|js|svg|ttf|woff|woff2|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Optional: security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
